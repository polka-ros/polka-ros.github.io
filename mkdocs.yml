site_name: polka
site_author: Panav Arpit Raaj
site_url: https://polka-ros.github.io/
repo_url: https://github.com/Pana1v/polka
edit_uri: edit/humble/doc/
site_description: "Multi-LiDAR fusion node for ROS 2, with optional CUDA acceleration"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  logo: images/polka.png
  favicon: images/polka.png
  features:
    - content.code.copy
    - navigation.top
    - toc.follow

use_directory_urls: false

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

copyright: Copyright &copy; 2025 - 2026 Panav Arpit Raaj
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pana1v/polka

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Pipeline: pipeline.md
  - Deskew: deskew.md
  - Performance: performance.md
